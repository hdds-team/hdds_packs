[workspace]
resolver = "2"
members = ["knox-types", "knox-sensors", "knox-monitor", "knox-admin"]

[workspace.dependencies]
hdds = "1.5.0"
knox-types = { path = "knox-types" }
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
gtk4 = "0.9"
eframe = "0.29"
egui = "0.29"
