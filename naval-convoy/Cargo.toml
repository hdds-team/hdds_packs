[workspace]
resolver = "2"
members = [
    "naval-types",
    "naval-sim",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["naskel"]

[workspace.dependencies]
# HDDS
hdds = "1.5.0"

# Internal
naval-types = { path = "naval-types" }

# Async runtime
tokio = { version = "1.43", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Utils
rand = "0.8"
anyhow = "1.0"
