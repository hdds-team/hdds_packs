[workspace]
resolver = "2"
members = ["xrce-types", "xrce-agent", "xrce-client-sim"]

[workspace.dependencies]
hdds = "1.5.0"
hdds-xrce = "0.1.0"
xrce-types = { path = "xrce-types" }
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
