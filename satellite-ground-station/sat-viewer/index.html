<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satellite Ground Station - HDDS Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: #0a0a1a;
            color: #c0c0d0;
            overflow: hidden;
        }

        #main-canvas {
            position: fixed;
            top: 0;
            left: 0;
        }

        /* HUD overlays */
        .hud {
            position: fixed;
            pointer-events: none;
            z-index: 100;
        }

        .hud-panel {
            background: rgba(10, 10, 26, 0.88);
            border: 1px solid rgba(80, 120, 200, 0.25);
            border-radius: 6px;
            padding: 10px 14px;
            backdrop-filter: blur(8px);
        }

        /* Top-left: title + connection */
        #title-bar {
            top: 12px;
            left: 12px;
        }

        #title-bar h1 {
            font-size: 15px;
            font-weight: 600;
            color: #7090ff;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 4px;
        }

        #connection-text {
            font-size: 11px;
        }

        .conn-on { color: #4ade80; }
        .conn-off { color: #f87171; }

        /* Right panel: telemetry */
        #telemetry-panel {
            top: 12px;
            right: 12px;
            width: 280px;
            max-height: calc(100vh - 180px);
            overflow-y: auto;
            pointer-events: auto;
        }

        #telemetry-panel h2 {
            font-size: 12px;
            color: #7090ff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .telem-block {
            margin-bottom: 8px;
            padding: 6px 8px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 4px;
            border-left: 3px solid #333;
        }

        .telem-block .sat-name {
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .telem-block .telem-row {
            font-size: 11px;
            color: #8890a0;
            display: flex;
            justify-content: space-between;
        }

        .telem-block .telem-row .val {
            color: #b0b8c8;
            font-family: 'Consolas', 'Menlo', monospace;
        }

        /* Bottom: pass timeline + alerts */
        #bottom-bar {
            bottom: 12px;
            left: 12px;
            right: 12px;
            display: flex;
            gap: 12px;
        }

        #pass-log {
            flex: 2;
            max-height: 140px;
            overflow-y: auto;
            pointer-events: auto;
        }

        #pass-log h3 {
            font-size: 11px;
            color: #7090ff;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .pass-item {
            font-size: 11px;
            padding: 3px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .pass-item .phase-aos { color: #4ade80; }
        .pass-item .phase-los { color: #f87171; }
        .pass-item .phase-track { color: #facc15; }

        #alert-log {
            flex: 1;
            max-height: 140px;
            overflow-y: auto;
            pointer-events: auto;
        }

        #alert-log h3 {
            font-size: 11px;
            color: #f87171;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 6px;
        }

        .alert-item {
            font-size: 11px;
            padding: 3px 0;
            color: #f09090;
            border-bottom: 1px solid rgba(255, 80, 80, 0.1);
        }

        @keyframes alert-flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .alert-new {
            animation: alert-flash 1s ease-in-out 3;
        }

        /* Loading screen */
        #loading {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0a0a1a;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #loading h1 {
            color: #7090ff;
            font-size: 28px;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        #loading p {
            color: #5060a0;
            font-size: 13px;
        }

        .spinner {
            width: 40px; height: 40px;
            border: 3px solid rgba(112, 144, 255, 0.2);
            border-top-color: #7090ff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 16px 0;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(112, 144, 255, 0.3); border-radius: 2px; }
    </style>
</head>
<body>
    <div id="loading">
        <h1>Satellite Ground Station</h1>
        <div class="spinner"></div>
        <p>Connecting to HDDS WebSocket bridge...</p>
    </div>

    <canvas id="main-canvas"></canvas>

    <div id="title-bar" class="hud hud-panel">
        <h1>Satellite Ground Station</h1>
        <span id="connection-text" class="conn-off">Disconnected</span>
    </div>

    <div id="telemetry-panel" class="hud hud-panel">
        <h2>Telemetry</h2>
        <div id="telem-content">No data</div>
    </div>

    <div id="bottom-bar" class="hud">
        <div id="pass-log" class="hud-panel">
            <h3>Pass Events</h3>
            <div id="pass-list"></div>
        </div>
        <div id="alert-log" class="hud-panel">
            <h3>Orbital Alerts</h3>
            <div id="alert-list"></div>
        </div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
