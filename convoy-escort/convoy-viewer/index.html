<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Convoy Escort - HDDS Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            overflow: hidden;
        }

        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .hud {
            position: fixed;
            pointer-events: none;
            z-index: 100;
        }

        .hud-panel {
            background: rgba(26, 26, 46, 0.9);
            border: 1px solid rgba(0, 200, 150, 0.4);
            border-radius: 8px;
            padding: 12px 16px;
            backdrop-filter: blur(10px);
        }

        /* Top left - Convoy Status */
        #convoy-status {
            top: 20px;
            left: 20px;
            min-width: 220px;
        }

        #convoy-status h2 {
            color: #00c896;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-line {
            font-size: 13px;
            margin: 5px 0;
            color: #a0d0c0;
        }

        .status-line .label {
            color: #609080;
            display: inline-block;
            width: 80px;
        }

        .threat-green { color: #4ade80 !important; }
        .threat-yellow { color: #fbbf24 !important; }
        .threat-orange { color: #fb923c !important; }
        .threat-red { color: #f87171 !important; animation: pulse 1s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Top right - Mini map */
        #mini-map {
            top: 20px;
            right: 20px;
            width: 200px;
            height: 200px;
        }

        #mini-map h3 {
            color: #00c896;
            font-size: 11px;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        #minimap-canvas {
            width: 100%;
            height: 180px;
            border-radius: 4px;
            background: #0d1117;
        }

        /* Bottom left - Vehicle list */
        #vehicle-list {
            bottom: 20px;
            left: 20px;
            max-width: 280px;
        }

        #vehicle-list h3 {
            color: #00c896;
            font-size: 11px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .vehicle-item {
            font-size: 11px;
            padding: 4px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            display: flex;
            justify-content: space-between;
        }

        .vehicle-item .role-lead { color: #60a5fa; }
        .vehicle-item .role-vip { color: #fbbf24; }
        .vehicle-item .role-escort { color: #a78bfa; }
        .vehicle-item .role-rear { color: #4ade80; }

        /* Connection status */
        #connection-status {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 101;
        }

        .status-connected { color: #4ade80; }
        .status-disconnected { color: #f87171; }
        .status-connecting { color: #fbbf24; }

        /* Loading screen */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }

        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #loading h1 {
            color: #00c896;
            font-size: 28px;
            margin-bottom: 10px;
        }

        #loading p {
            color: #609080;
            font-size: 14px;
        }

        .loading-spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(0, 200, 150, 0.2);
            border-top-color: #00c896;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px 0;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Alerts */
        #alerts {
            bottom: 20px;
            right: 20px;
            max-width: 300px;
        }

        #alerts h3 {
            color: #00c896;
            font-size: 11px;
            margin-bottom: 8px;
            text-transform: uppercase;
        }

        .alert-item {
            font-size: 11px;
            padding: 6px 8px;
            margin-bottom: 4px;
            border-radius: 4px;
            background: rgba(251, 191, 36, 0.1);
            border-left: 3px solid #fbbf24;
        }

        .alert-item.threat-red {
            background: rgba(248, 113, 113, 0.1);
            border-left-color: #f87171;
        }
    </style>
</head>
<body>
    <div id="loading">
        <h1>CONVOY ESCORT</h1>
        <div class="loading-spinner"></div>
        <p>Connecting to HDDS...</p>
    </div>

    <div id="canvas-container"></div>

    <div id="connection-status" class="hud hud-panel">
        <span class="status-connecting">Connecting...</span>
    </div>

    <div id="convoy-status" class="hud hud-panel">
        <h2>Convoy Alpha</h2>
        <div class="status-line"><span class="label">Mission:</span> <span id="mission-name">VIP Escort</span></div>
        <div class="status-line"><span class="label">Vehicles:</span> <span id="vehicle-count">-</span></div>
        <div class="status-line"><span class="label">Speed:</span> <span id="avg-speed">-</span></div>
        <div class="status-line"><span class="label">Progress:</span> <span id="progress">-</span></div>
        <div class="status-line"><span class="label">Threat:</span> <span id="threat-level" class="threat-green">GREEN</span></div>
    </div>

    <div id="mini-map" class="hud hud-panel">
        <h3>Tactical Map</h3>
        <canvas id="minimap-canvas" width="180" height="180"></canvas>
    </div>

    <div id="vehicle-list" class="hud hud-panel">
        <h3>Vehicles</h3>
        <div id="vehicles-container"></div>
    </div>

    <div id="alerts" class="hud hud-panel">
        <h3>Alerts</h3>
        <div id="alerts-container"></div>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>
</html>
