[workspace]
resolver = "2"
members = [
    "convoy-types",
    "convoy-sim",
    
]

[workspace.dependencies]
hdds = { path = "/projects/public/hdds/crates/hdds" }
convoy-types = { path = "convoy-types" }
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
