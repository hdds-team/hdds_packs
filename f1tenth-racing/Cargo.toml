[workspace]
resolver = "2"
members = [
    "f1tenth-types",
    "f1tenth-sim",
]

[workspace.dependencies]
hdds = { path = "/projects/public/hdds/crates/hdds" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
anyhow = "1.0"
rand = "0.8"
