; PlatformIO Project Configuration
; HDDS Remote Sensor - ESP32-WROVER-CAM with HC-12
;
; Hardware:
;   - ESP32-WROVER-CAM (4MB Flash, 4MB PSRAM)
;   - HC-12 433MHz radio (5V powered!)
;   - OV2640 camera

[env:esp32-wrover-cam]
platform = espressif32
board = esp-wrover-kit
framework = arduino

; WROVER has PSRAM - enable it
build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3
    ; Increase loop task stack (default 8KB -> 16KB) for camera + fragmentation
    -DARDUINO_LOOP_STACK_SIZE=16384
    ; Link hdds-micro static library
    -Llib/hdds-micro
    -lhdds_micro_c

; Dependencies (auto-installed by PlatformIO)
lib_deps =
    eloquentarduino/EloquentEsp32cam

; Monitor settings
monitor_speed = 115200
upload_speed = 921600

; Large app partition for camera + HDDS
board_build.partitions = huge_app.csv
