[workspace]
resolver = "2"
members = ["recorder-types", "recorder-sim", "recorder-sink", "recorder-replay"]

[workspace.dependencies]
hdds = "1.5.0"
hdds-influx-sink = "0.1.0"
recorder-types = { path = "recorder-types" }
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
ratatui = "0.29"
crossterm = "0.28"
