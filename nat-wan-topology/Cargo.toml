[workspace]
resolver = "2"
members = ["wan-types", "wan-site", "wan-topology"]

[workspace.dependencies]
hdds = { path = "/projects/public/hdds/crates/hdds" }
wan-types = { path = "wan-types" }
tokio = { version = "1.43", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
eframe = "0.30"
egui = "0.30"
